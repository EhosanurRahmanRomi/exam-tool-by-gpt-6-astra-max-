      <path d="M27 15Q68 9 108 23M27 28Q68 22 108 36M27 41Q68 35 95 44" fill="none"/>
      <path d="M159 23Q199 9 239 15M159 36Q199 22 239 28M172 44Q199 35 239 41" fill="none"/>
